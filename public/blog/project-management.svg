<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.14)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Kanban board -->
  <g>
    <rect x="440" y="100" width="90" height="250" rx="10" fill="url(#card)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <rect x="460" y="118" width="50" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
    <rect x="452" y="140" width="66" height="34" rx="6" fill="rgba(255,255,255,0.18)"/>
    <rect x="452" y="182" width="66" height="34" rx="6" fill="rgba(255,255,255,0.18)"/>

    <rect x="545" y="100" width="90" height="250" rx="10" fill="url(#card)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <rect x="565" y="118" width="50" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
    <rect x="557" y="140" width="66" height="34" rx="6" fill="#6ee7b7" opacity="0.5"/>
    <rect x="557" y="182" width="66" height="34" rx="6" fill="rgba(255,255,255,0.18)"/>
    <rect x="557" y="224" width="66" height="34" rx="6" fill="rgba(255,255,255,0.18)"/>

    <rect x="650" y="100" width="90" height="250" rx="10" fill="url(#card)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <rect x="670" y="118" width="50" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
    <rect x="662" y="140" width="66" height="34" rx="6" fill="#6ee7b7" opacity="0.7"/>
  </g>

  <!-- Check-circle badge, center-left -->
  <g transform="translate(230 225)">
    <circle r="95" fill="rgba(255,255,255,0.08)"/>
    <circle r="52" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
    <path d="M-22 0 -6 18 26 -22" fill="none" stroke="#6ee7b7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#ffffff" opacity="0.55">
    <path d="M120 100 124 110 134 114 124 118 120 128 116 118 106 114 116 110Z"/>
    <path d="M700 380 703 388 711 391 703 394 700 402 697 394 689 391 697 388Z"/>
  </g>
</svg>
