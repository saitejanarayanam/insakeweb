<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7f1d1d"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Document cards -->
  <rect x="80" y="120" width="180" height="240" rx="12" fill="url(#card)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="88" y="140" width="100" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>
  <rect x="88" y="158" width="140" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="88" y="172" width="120" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="88" y="186" width="130" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="88" y="210" width="80" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="88" y="224" width="110" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="88" y="238" width="90" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <!-- Red flag on document -->
  <rect x="220" y="128" width="4" height="30" fill="#fca5a5"/>
  <polygon points="224,128 224,142 236,135" fill="#ef4444"/>
  
  <!-- Magnifying glass -->
  <circle cx="380" cy="200" r="90" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <circle cx="380" cy="200" r="80" fill="rgba(0,0,0,0.3)"/>
  <!-- Inside glass content -->
  <rect x="330" y="170" width="50" height="5" rx="2" fill="#fbbf24"/>
  <rect x="330" y="182" width="70" height="5" rx="2" fill="rgba(255,255,255,0.5)"/>
  <rect x="330" y="194" width="60" height="5" rx="2" fill="rgba(255,255,255,0.5)"/>
  <rect x="330" y="206" width="55" height="5" rx="2" fill="#ef4444"/>
  <rect x="330" y="218" width="65" height="5" rx="2" fill="rgba(255,255,255,0.5)"/>
  <!-- Handle -->
  <line x1="448" y1="268" x2="500" y2="320" stroke="rgba(255,255,255,0.6)" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Connection strings (investigation board) -->
  <line x1="260" y1="200" x2="295" y2="200" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4 3"/>
  
  <!-- Evidence folder right -->
  <rect x="520" y="140" width="160" height="210" rx="10" fill="url(#card)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="520" y="140" width="70" height="20" rx="4" fill="rgba(255,100,100,0.4)"/>
  <rect x="532" y="175" width="120" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>
  <rect x="532" y="190" width="100" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="532" y="205" width="110" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="532" y="230" width="80" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="532" y="245" width="100" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <!-- Check mark -->
  <circle cx="650" cy="310" r="20" fill="rgba(239,68,68,0.3)" stroke="#f87171" stroke-width="1.5"/>
  <polyline points="641,310 648,318 660,302" fill="none" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Line from glass to folder -->
  <line x1="465" y1="200" x2="518" y2="200" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4 3"/>
  
  <!-- Title area -->
  <rect x="60" y="370" width="280" height="50" rx="10" fill="rgba(0,0,0,0.3)"/>
  <text x="200" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="white">CFE Certification</text>
  <text x="200" y="408" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">Certified Fraud Examiner</text>
  
  <!-- Bottom glow -->
  <ellipse cx="400" cy="440" rx="300" ry="30" fill="rgba(239,68,68,0.15)"/>
</svg>
