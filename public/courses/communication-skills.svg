<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1" fill="rgba(255,255,255,0.06)"/>
  </pattern>
  <rect width="800" height="450" fill="url(#dots)"/>
  
  <!-- Microphone stand -->
  <ellipse cx="200" cy="380" rx="60" ry="8" fill="rgba(0,0,0,0.4)"/>
  <rect x="197" y="280" width="6" height="105" rx="3" fill="rgba(255,255,255,0.5)"/>
  <rect x="175" y="350" width="50" height="4" rx="2" fill="rgba(255,255,255,0.5)"/>
  <!-- Microphone head -->
  <rect x="175" y="220" width="50" height="70" rx="25" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <!-- Mic grille lines -->
  <line x1="185" y1="230" x2="185" y2="280" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="192" y1="225" x2="192" y2="285" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="199" y1="222" x2="199" y2="287" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="206" y1="222" x2="206" y2="287" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="213" y1="225" x2="213" y2="285" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Sound waves -->
  <path d="M 240 245 Q 260 255 240 265" fill="none" stroke="rgba(56,189,248,0.6)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 240 235 Q 275 255 240 275" fill="none" stroke="rgba(56,189,248,0.4)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 240 225 Q 295 255 240 285" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 160 245 Q 140 255 160 265" fill="none" stroke="rgba(56,189,248,0.6)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 160 235 Q 125 255 160 275" fill="none" stroke="rgba(56,189,248,0.4)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Speaking person silhouette -->
  <circle cx="450" cy="130" r="40" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <circle cx="450" cy="115" r="18" fill="rgba(255,255,255,0.35)"/>
  <path d="M 415 190 Q 420 155 450 150 Q 480 155 485 190 L 490 250 L 410 250 Z" fill="rgba(255,255,255,0.2)"/>
  <!-- Speech bubble -->
  <rect x="500" y="85" width="190" height="90" rx="12" fill="rgba(2,132,199,0.3)" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <polygon points="500,130 480,145 500,150" fill="rgba(2,132,199,0.3)"/>
  <text x="595" y="118" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="rgba(255,255,255,0.8)">"Clear. Confident.</text>
  <text x="595" y="136" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="rgba(255,255,255,0.8)">Impactful."</text>
  <text x="595" y="160" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(147,197,253,0.8)">Effective Communication</text>
  
  <!-- Skills tags -->
  <rect x="340" y="280" width="100" height="30" rx="15" fill="rgba(2,132,199,0.25)" stroke="rgba(56,189,248,0.35)" stroke-width="1"/>
  <text x="390" y="300" text-anchor="middle" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.7)">Active Listening</text>
  <rect x="455" y="280" width="80" height="30" rx="15" fill="rgba(2,132,199,0.25)" stroke="rgba(56,189,248,0.35)" stroke-width="1"/>
  <text x="495" y="300" text-anchor="middle" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.7)">Empathy</text>
  <rect x="550" y="280" width="100" height="30" rx="15" fill="rgba(2,132,199,0.25)" stroke="rgba(56,189,248,0.35)" stroke-width="1"/>
  <text x="600" y="300" text-anchor="middle" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.7)">Body Language</text>
  <rect x="340" y="322" width="90" height="30" rx="15" fill="rgba(2,132,199,0.25)" stroke="rgba(56,189,248,0.35)" stroke-width="1"/>
  <text x="385" y="342" text-anchor="middle" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.7)">Email Writing</text>
  <rect x="445" y="322" width="110" height="30" rx="15" fill="rgba(2,132,199,0.25)" stroke="rgba(56,189,248,0.35)" stroke-width="1"/>
  <text x="500" y="342" text-anchor="middle" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.7)">Verbal Clarity</text>
  <rect x="570" y="322" width="90" height="30" rx="15" fill="rgba(2,132,199,0.25)" stroke="rgba(56,189,248,0.35)" stroke-width="1"/>
  <text x="615" y="342" text-anchor="middle" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.7)">Assertiveness</text>
  
  <!-- Book icon left -->
  <rect x="60" y="90" width="120" height="150" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="120" y1="90" x2="120" y2="240" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="72" y="108" width="40" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="72" y="120" width="80" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="72" y="132" width="70" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="72" y="144" width="75" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="72" y="160" width="40" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="72" y="172" width="80" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <text x="98" y="215" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.4)">Communication</text>
  <text x="98" y="228" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.4)">Skills Guide</text>
  
  <ellipse cx="400" cy="445" rx="320" ry="15" fill="rgba(2,132,199,0.15)"/>
</svg>
