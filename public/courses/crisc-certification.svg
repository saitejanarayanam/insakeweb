<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#78350f"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.14)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Risk gauge -->
  <path d="M240 260 A160 160 0 0 1 560 260" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="22"/>
  <path d="M240 260 A160 160 0 0 1 340 122" fill="none" stroke="#fde68a" stroke-width="22"/>
  <path d="M340 122 A160 160 0 0 1 470 118" fill="none" stroke="#fbbf24" stroke-width="22"/>
  <path d="M470 118 A160 160 0 0 1 560 260" fill="none" stroke="#f97316" stroke-width="22"/>
  <!-- Needle -->
  <line x1="400" y1="260" x2="470" y2="160" stroke="#fff7ed" stroke-width="5" stroke-linecap="round"/>
  <circle cx="400" cy="260" r="14" fill="#fff7ed" stroke="#78350f" stroke-width="3"/>
  <text x="400" y="300" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="rgba(255,255,255,0.85)">Risk Exposure</text>

  <!-- Risk register card -->
  <rect x="70" y="90" width="190" height="230" rx="14" fill="url(#card)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <rect x="90" y="112" width="100" height="9" rx="4" fill="rgba(255,255,255,0.32)"/>
  <rect x="90" y="140" width="150" height="8" rx="4" fill="rgba(255,255,255,0.18)"/>
  <rect x="90" y="140" width="60" height="8" rx="4" fill="#fca5a5"/>
  <rect x="90" y="160" width="150" height="8" rx="4" fill="rgba(255,255,255,0.18)"/>
  <rect x="90" y="160" width="100" height="8" rx="4" fill="#fde68a"/>
  <rect x="90" y="180" width="150" height="8" rx="4" fill="rgba(255,255,255,0.18)"/>
  <rect x="90" y="180" width="40" height="8" rx="4" fill="#86efac"/>
  <rect x="90" y="200" width="150" height="8" rx="4" fill="rgba(255,255,255,0.18)"/>
  <rect x="90" y="200" width="120" height="8" rx="4" fill="#fca5a5"/>

  <!-- Controls panel -->
  <rect x="560" y="200" width="170" height="140" rx="12" fill="url(#card)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="645" y="222" text-anchor="middle" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.7)">Controls</text>
  <circle cx="583" cy="245" r="8" fill="rgba(134,239,172,0.4)" stroke="#86efac" stroke-width="1.5"/>
  <polyline points="579,245 582,248 588,241" fill="none" stroke="#f0fdf4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="600" y="240" width="110" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="583" cy="270" r="8" fill="rgba(134,239,172,0.4)" stroke="#86efac" stroke-width="1.5"/>
  <polyline points="579,270 582,273 588,266" fill="none" stroke="#f0fdf4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="600" y="265" width="90" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="583" cy="295" r="8" fill="rgba(253,224,71,0.4)" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="600" y="290" width="100" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>

  <!-- Title -->
  <rect x="60" y="360" width="240" height="52" rx="10" fill="rgba(0,0,0,0.32)"/>
  <text x="180" y="382" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="white">CRISC Certification</text>
  <text x="180" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">Risk &amp; Information Systems Control</text>

  <ellipse cx="400" cy="440" rx="320" ry="18" fill="rgba(217,119,6,0.2)"/>
</svg>
