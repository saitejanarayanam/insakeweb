<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Power BI Dashboard -->
  <rect x="40" y="70" width="720" height="320" rx="14" fill="rgba(0,0,0,0.45)" stroke="rgba(139,92,246,0.35)" stroke-width="1"/>
  <!-- Top navigation -->
  <rect x="40" y="70" width="720" height="36" rx="14" fill="rgba(109,40,217,0.5)"/>
  <rect x="40" y="88" width="720" height="18" fill="rgba(109,40,217,0.5)"/>
  <text x="60" y="93" font-family="system-ui" font-size="11" font-weight="700" fill="white">Power BI</text>
  <rect x="130" y="78" width="60" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="160" y="91" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.8)">Report</text>
  <rect x="198" y="78" width="60" height="20" rx="4" fill="rgba(255,255,255,0.08)"/>
  <text x="228" y="91" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.5)">Data</text>
  <rect x="266" y="78" width="60" height="20" rx="4" fill="rgba(255,255,255,0.08)"/>
  <text x="296" y="91" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.5)">Model</text>
  
  <!-- Left sidebar with fields -->
  <rect x="40" y="106" width="130" height="284" fill="rgba(0,0,0,0.3)"/>
  <text x="55" y="124" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.5)">Fields</text>
  <rect x="50" y="130" width="110" height="16" rx="3" fill="rgba(139,92,246,0.3)"/>
  <text x="58" y="142" font-family="monospace" font-size="8" fill="rgba(196,181,253,0.9)">📊 Sales</text>
  <rect x="50" y="150" width="110" height="16" rx="3" fill="rgba(255,255,255,0.04)"/>
  <text x="58" y="162" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">📅 Date</text>
  <rect x="50" y="170" width="110" height="16" rx="3" fill="rgba(255,255,255,0.04)"/>
  <text x="58" y="182" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">🌍 Region</text>
  <rect x="50" y="190" width="110" height="16" rx="3" fill="rgba(255,255,255,0.04)"/>
  <text x="58" y="202" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">👤 Customer</text>
  <rect x="50" y="210" width="110" height="16" rx="3" fill="rgba(255,255,255,0.04)"/>
  <text x="58" y="222" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">💰 Revenue</text>
  
  <!-- Main canvas with KPI cards -->
  <rect x="175" y="110" width="130" height="70" rx="8" fill="rgba(109,40,217,0.35)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="240" y="132" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(196,181,253,0.8)">Total Revenue</text>
  <text x="240" y="158" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="700" fill="white">₹4.2M</text>
  <text x="240" y="174" text-anchor="middle" font-family="system-ui" font-size="8" fill="#86efac">▲ 12.4%</text>
  
  <rect x="315" y="110" width="130" height="70" rx="8" fill="rgba(59,130,246,0.25)" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
  <text x="380" y="132" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(147,197,253,0.8)">Customers</text>
  <text x="380" y="158" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="700" fill="white">8,420</text>
  <text x="380" y="174" text-anchor="middle" font-family="system-ui" font-size="8" fill="#86efac">▲ 8.1%</text>
  
  <rect x="455" y="110" width="130" height="70" rx="8" fill="rgba(16,185,129,0.2)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
  <text x="520" y="132" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(110,231,183,0.8)">Avg Order</text>
  <text x="520" y="158" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="700" fill="white">₹499</text>
  <text x="520" y="174" text-anchor="middle" font-family="system-ui" font-size="8" fill="#f87171">▼ 2.1%</text>
  
  <rect x="595" y="110" width="130" height="70" rx="8" fill="rgba(245,158,11,0.2)" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
  <text x="660" y="132" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(253,230,138,0.8)">Conversion</text>
  <text x="660" y="158" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="700" fill="white">3.8%</text>
  <text x="660" y="174" text-anchor="middle" font-family="system-ui" font-size="8" fill="#86efac">▲ 0.3%</text>
  
  <!-- Bar chart -->
  <rect x="175" y="194" width="280" height="180" rx="8" fill="rgba(0,0,0,0.25)" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <text x="188" y="212" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.5)">Monthly Sales</text>
  <rect x="188" y="300" width="18" height="50" rx="2" fill="#8b5cf6"/>
  <rect x="212" y="285" width="18" height="65" rx="2" fill="#8b5cf6"/>
  <rect x="236" y="270" width="18" height="80" rx="2" fill="#8b5cf6"/>
  <rect x="260" y="255" width="18" height="95" rx="2" fill="#7c3aed"/>
  <rect x="284" y="240" width="18" height="110" rx="2" fill="#7c3aed"/>
  <rect x="308" y="260" width="18" height="90" rx="2" fill="#6d28d9"/>
  <rect x="332" y="230" width="18" height="120" rx="2" fill="#6d28d9"/>
  <rect x="356" y="215" width="18" height="135" rx="2" fill="#5b21b6"/>
  <line x1="185" y1="355" x2="440" y2="355" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Donut chart -->
  <rect x="465" y="194" width="260" height="180" rx="8" fill="rgba(0,0,0,0.25)" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <text x="478" y="212" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.5)">By Region</text>
  <circle cx="565" cy="290" r="55" fill="none" stroke="#8b5cf6" stroke-width="22" stroke-dasharray="138 346"/>
  <circle cx="565" cy="290" r="55" fill="none" stroke="#3b82f6" stroke-width="22" stroke-dasharray="104 380" stroke-dashoffset="-138"/>
  <circle cx="565" cy="290" r="55" fill="none" stroke="#10b981" stroke-width="22" stroke-dasharray="69 415" stroke-dashoffset="-242"/>
  <circle cx="565" cy="290" r="55" fill="none" stroke="#f59e0b" stroke-width="22" stroke-dasharray="35 450" stroke-dashoffset="-311"/>
  <circle cx="565" cy="290" r="38" fill="rgba(0,0,0,0.5)"/>
  <text x="565" y="287" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.5)">Total</text>
  <text x="565" y="302" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="white">346</text>
  
  <ellipse cx="400" cy="440" rx="320" ry="25" fill="rgba(109,40,217,0.15)"/>
</svg>
