<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b0764"/>
      <stop offset="100%" style="stop-color:#7e22ce"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.14)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Boardroom table, top-down -->
  <ellipse cx="400" cy="230" rx="200" ry="80" fill="url(#card)" stroke="rgba(233,213,255,0.4)" stroke-width="1.5"/>
  <ellipse cx="400" cy="230" rx="130" ry="50" fill="none" stroke="rgba(233,213,255,0.2)" stroke-width="1"/>

  <!-- Seats around the table -->
  <g fill="rgba(216,180,254,0.55)" stroke="#e9d5ff" stroke-width="1.5">
    <circle cx="400" cy="150" r="16"/>
    <circle cx="270" cy="185" r="16"/>
    <circle cx="230" cy="255" r="16"/>
    <circle cx="330" cy="305" r="16"/>
    <circle cx="470" cy="305" r="16"/>
    <circle cx="570" cy="255" r="16"/>
    <circle cx="530" cy="185" r="16"/>
  </g>

  <!-- Gavel over the table, symbol of governance decisions -->
  <g transform="translate(400,225) rotate(-30)">
    <rect x="-10" y="-70" width="20" height="55" rx="6" fill="rgba(233,213,255,0.85)"/>
    <rect x="-26" y="-16" width="52" height="24" rx="6" fill="#e9d5ff" stroke="#f3e8ff" stroke-width="2"/>
  </g>

  <!-- Strategy alignment tags -->
  <rect x="60" y="90" width="140" height="26" rx="13" fill="rgba(126,34,206,0.3)" stroke="rgba(233,213,255,0.4)" stroke-width="1"/>
  <text x="130" y="107" text-anchor="middle" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.8)">Strategic Alignment</text>

  <rect x="600" y="90" width="140" height="26" rx="13" fill="rgba(126,34,206,0.3)" stroke="rgba(233,213,255,0.4)" stroke-width="1"/>
  <text x="670" y="107" text-anchor="middle" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.8)">Value Delivery</text>

  <rect x="60" y="330" width="140" height="26" rx="13" fill="rgba(126,34,206,0.3)" stroke="rgba(233,213,255,0.4)" stroke-width="1"/>
  <text x="130" y="347" text-anchor="middle" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.8)">Resource Mgmt</text>

  <rect x="600" y="330" width="140" height="26" rx="13" fill="rgba(126,34,206,0.3)" stroke="rgba(233,213,255,0.4)" stroke-width="1"/>
  <text x="670" y="347" text-anchor="middle" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.8)">Risk Oversight</text>

  <!-- Title -->
  <rect x="290" y="20" width="220" height="46" rx="10" fill="rgba(0,0,0,0.3)"/>
  <text x="400" y="41" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="white">CGEIT Certification</text>
  <text x="400" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.75)">Governance of Enterprise IT</text>

  <ellipse cx="400" cy="440" rx="320" ry="18" fill="rgba(126,34,206,0.22)"/>
</svg>
