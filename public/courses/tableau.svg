<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1445"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1" fill="rgba(255,255,255,0.07)"/>
  </pattern>
  <rect width="800" height="450" fill="url(#dots)"/>
  
  <!-- Tableau-style colorful charts -->
  <!-- Scatter plot -->
  <rect x="45" y="80" width="340" height="290" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(96,165,250,0.25)" stroke-width="1"/>
  <text x="60" y="104" font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.6)">Profit vs Sales Scatter</text>
  <!-- Axes -->
  <line x1="80" y1="340" x2="360" y2="340" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="80" y1="120" x2="80" y2="340" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Scatter dots (colorful) -->
  <circle cx="110" cy="310" r="6" fill="#f87171" opacity="0.85"/>
  <circle cx="140" cy="280" r="8" fill="#fb923c" opacity="0.85"/>
  <circle cx="170" cy="250" r="5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="190" cy="230" r="9" fill="#34d399" opacity="0.85"/>
  <circle cx="210" cy="200" r="7" fill="#22d3ee" opacity="0.85"/>
  <circle cx="240" cy="185" r="6" fill="#60a5fa" opacity="0.85"/>
  <circle cx="265" cy="165" r="10" fill="#a78bfa" opacity="0.85"/>
  <circle cx="295" cy="150" r="5" fill="#f472b6" opacity="0.85"/>
  <circle cx="315" cy="135" r="8" fill="#34d399" opacity="0.85"/>
  <circle cx="340" cy="125" r="7" fill="#60a5fa" opacity="0.85"/>
  <circle cx="155" cy="295" r="5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="225" cy="220" r="6" fill="#a78bfa" opacity="0.85"/>
  <circle cx="280" cy="175" r="7" fill="#f472b6" opacity="0.85"/>
  <!-- Trend line -->
  <line x1="100" y1="325" x2="350" y2="120" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="5 3"/>
  
  <!-- Map visualization -->
  <rect x="400" y="80" width="355" height="130" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(96,165,250,0.25)" stroke-width="1"/>
  <text x="415" y="104" font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.6)">Geographic Distribution</text>
  <!-- India map rough outline bubbles -->
  <circle cx="520" cy="150" r="18" fill="rgba(34,211,153,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="520" y="154" text-anchor="middle" font-family="system-ui" font-size="7" fill="white">North</text>
  <circle cx="570" cy="180" r="25" fill="rgba(96,165,250,0.4)" stroke="#60a5fa" stroke-width="1"/>
  <text x="570" y="184" text-anchor="middle" font-family="system-ui" font-size="7" fill="white">East</text>
  <circle cx="485" cy="175" r="14" fill="rgba(251,191,36,0.4)" stroke="#fbbf24" stroke-width="1"/>
  <text x="485" y="179" text-anchor="middle" font-family="system-ui" font-size="6" fill="white">West</text>
  <circle cx="530" cy="195" r="20" fill="rgba(248,113,113,0.4)" stroke="#f87171" stroke-width="1"/>
  <text x="530" y="199" text-anchor="middle" font-family="system-ui" font-size="7" fill="white">South</text>
  <!-- Legend -->
  <circle cx="665" cy="140" r="5" fill="#34d399"/>
  <text x="674" y="144" font-family="system-ui" font-size="8" fill="rgba(255,255,255,0.5)">High</text>
  <circle cx="665" cy="158" r="5" fill="#60a5fa"/>
  <text x="674" y="162" font-family="system-ui" font-size="8" fill="rgba(255,255,255,0.5)">Med</text>
  <circle cx="665" cy="176" r="5" fill="#fbbf24"/>
  <text x="674" y="180" font-family="system-ui" font-size="8" fill="rgba(255,255,255,0.5)">Low</text>
  
  <!-- Area chart -->
  <rect x="400" y="220" width="355" height="150" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(96,165,250,0.25)" stroke-width="1"/>
  <text x="415" y="244" font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.6)">Revenue Trend</text>
  <!-- Area 1 -->
  <polygon points="415,340 450,300 490,310 530,270 570,250 610,230 650,210 720,195 720,355 415,355" fill="rgba(96,165,250,0.25)"/>
  <polyline points="415,340 450,300 490,310 530,270 570,250 610,230 650,210 720,195" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <!-- Area 2 -->
  <polygon points="415,350 450,320 490,325 530,295 570,285 610,275 650,260 720,248 720,355 415,355" fill="rgba(167,139,250,0.2)"/>
  <polyline points="415,350 450,320 490,325 530,295 570,285 610,275 650,260 720,248" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <line x1="415" y1="355" x2="720" y2="355" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <ellipse cx="400" cy="440" rx="320" ry="25" fill="rgba(29,78,216,0.15)"/>
</svg>
