<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Excel spreadsheet mockup -->
  <rect x="50" y="80" width="700" height="300" rx="12" fill="rgba(0,0,0,0.45)" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="50" y="80" width="700" height="30" rx="12" fill="rgba(37,99,235,0.4)"/>
  <circle cx="70" cy="95" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="85" cy="95" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="100" cy="95" r="5" fill="rgba(255,255,255,0.1)"/>
  <text x="400" y="100" text-anchor="middle" font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.7)">Advanced_Dashboard.xlsx</text>
  <!-- Formula bar -->
  <rect x="50" y="110" width="700" height="22" fill="rgba(0,0,0,0.3)"/>
  <text x="65" y="125" font-family="monospace" font-size="9" fill="rgba(147,197,253,0.8)">fx</text>
  <rect x="85" y="113" width="1" height="16" fill="rgba(255,255,255,0.2)"/>
  <text x="92" y="125" font-family="monospace" font-size="9" fill="#93c5fd">=XLOOKUP(A2,DataTable[ID],DataTable[Revenue],0)</text>
  
  <!-- Column headers -->
  <rect x="50" y="132" width="700" height="20" fill="rgba(37,99,235,0.2)"/>
  <text x="70" y="146" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">A</text>
  <text x="130" y="146" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">B</text>
  <text x="200" y="146" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">C</text>
  <text x="270" y="146" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">D</text>
  <text x="340" y="146" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">E</text>
  <text x="420" y="146" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">F</text>
  
  <!-- Vertical lines -->
  <line x1="115" y1="132" x2="115" y2="380" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="185" y1="132" x2="185" y2="380" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="255" y1="132" x2="255" y2="380" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="325" y1="132" x2="325" y2="380" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="405" y1="132" x2="405" y2="380" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
