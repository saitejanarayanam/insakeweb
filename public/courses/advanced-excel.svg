  <text x="58" y="165" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">Region</text>
  <text x="122" y="165" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">Q1</text>
  <text x="192" y="165" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">Q2</text>
  <text x="262" y="165" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">Q3</text>
  <text x="332" y="165" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">Q4</text>
  <text x="412" y="165" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">Total</text>
  
  <text x="58" y="184" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.7)">North</text>
  <text x="122" y="184" font-family="monospace" font-size="8" fill="#86efac">1,240</text>
  <text x="192" y="184" font-family="monospace" font-size="8" fill="#86efac">1,380</text>
  <text x="262" y="184" font-family="monospace" font-size="8" fill="#86efac">1,520</text>
  <text x="332" y="184" font-family="monospace" font-size="8" fill="#86efac">1,890</text>
  <text x="412" y="184" font-family="monospace" font-size="8" fill="#fbbf24">6,030</text>
  
  <text x="58" y="202" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.7)">South</text>
  <text x="122" y="202" font-family="monospace" font-size="8" fill="#86efac">980</text>
  <text x="192" y="202" font-family="monospace" font-size="8" fill="#f87171">870</text>
  <text x="262" y="202" font-family="monospace" font-size="8" fill="#86efac">1,100</text>
  <text x="332" y="202" font-family="monospace" font-size="8" fill="#86efac">1,340</text>
  <text x="412" y="202" font-family="monospace" font-size="8" fill="#fbbf24">4,290</text>
  
  <text x="58" y="220" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.7)">East</text>
  <text x="122" y="220" font-family="monospace" font-size="8" fill="#86efac">2,100</text>
  <text x="192" y="220" font-family="monospace" font-size="8" fill="#86efac">2,340</text>
  <text x="262" y="220" font-family="monospace" font-size="8" fill="#86efac">2,560</text>
  <text x="332" y="220" font-family="monospace" font-size="8" fill="#86efac">2,890</text>
  <text x="412" y="220" font-family="monospace" font-size="8" fill="#fbbf24">9,890</text>
  
  <!-- Highlighted selected cell -->
  <rect x="118" y="215" width="65" height="16" rx="1" fill="rgba(37,99,235,0.35)" stroke="#3b82f6" stroke-width="1.5"/>
  
  <!-- Mini chart embedded in sheet -->
  <rect x="440" y="155" width="290" height="200" rx="8" fill="rgba(37,99,235,0.12)" stroke="rgba(96,165,250,0.2)" stroke-width="1"/>
  <!-- Bar chart bars -->
  <rect x="460" y="285" width="22" height="55" rx="2" fill="#3b82f6"/>
  <rect x="490" y="265" width="22" height="75" rx="2" fill="#3b82f6"/>
  <rect x="520" y="250" width="22" height="90" rx="2" fill="#3b82f6"/>
  <rect x="550" y="235" width="22" height="105" rx="2" fill="#60a5fa"/>
  <rect x="580" y="220" width="22" height="120" rx="2" fill="#93c5fd"/>
  <rect x="610" y="210" width="22" height="130" rx="2" fill="#bfdbfe"/>
  <line x1="452" y1="345" x2="720" y2="345" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="580" y="168" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.5)">Quarterly Trend</text>
  
  <ellipse cx="400" cy="440" rx="320" ry="25" fill="rgba(59,130,246,0.12)"/>
