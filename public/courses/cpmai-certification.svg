<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#c026d3"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(192,38,211,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(76,29,149,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- AI Brain (neural net) -->
  <circle cx="280" cy="200" r="70" fill="none" stroke="rgba(216,180,254,0.4)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <!-- Brain nodes -->
  <circle cx="280" cy="200" r="12" fill="rgba(139,92,246,0.8)" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="240" cy="165" r="8" fill="rgba(168,85,247,0.7)" stroke="#c4b5fd" stroke-width="1.5"/>
  <circle cx="320" cy="165" r="8" fill="rgba(168,85,247,0.7)" stroke="#c4b5fd" stroke-width="1.5"/>
  <circle cx="240" cy="235" r="8" fill="rgba(168,85,247,0.7)" stroke="#c4b5fd" stroke-width="1.5"/>
  <circle cx="320" cy="235" r="8" fill="rgba(168,85,247,0.7)" stroke="#c4b5fd" stroke-width="1.5"/>
  <circle cx="210" cy="200" r="6" fill="rgba(192,38,211,0.7)" stroke="#e879f9" stroke-width="1.5"/>
  <circle cx="350" cy="200" r="6" fill="rgba(192,38,211,0.7)" stroke="#e879f9" stroke-width="1.5"/>
  <circle cx="265" cy="138" r="6" fill="rgba(192,38,211,0.7)" stroke="#e879f9" stroke-width="1.5"/>
  <circle cx="295" cy="138" r="6" fill="rgba(192,38,211,0.7)" stroke="#e879f9" stroke-width="1.5"/>
  <circle cx="265" cy="262" r="6" fill="rgba(192,38,211,0.7)" stroke="#e879f9" stroke-width="1.5"/>
  <circle cx="295" cy="262" r="6" fill="rgba(192,38,211,0.7)" stroke="#e879f9" stroke-width="1.5"/>
  <!-- Neural connections -->
  <line x1="280" y1="200" x2="240" y2="165" stroke="rgba(196,181,253,0.5)" stroke-width="1.5"/>
  <line x1="280" y1="200" x2="320" y2="165" stroke="rgba(196,181,253,0.5)" stroke-width="1.5"/>
  <line x1="280" y1="200" x2="240" y2="235" stroke="rgba(196,181,253,0.5)" stroke-width="1.5"/>
  <line x1="280" y1="200" x2="320" y2="235" stroke="rgba(196,181,253,0.5)" stroke-width="1.5"/>
  <line x1="280" y1="200" x2="210" y2="200" stroke="rgba(196,181,253,0.5)" stroke-width="1.5"/>
  <line x1="280" y1="200" x2="350" y2="200" stroke="rgba(196,181,253,0.5)" stroke-width="1.5"/>
  <line x1="240" y1="165" x2="265" y2="138" stroke="rgba(196,181,253,0.3)" stroke-width="1"/>
  <line x1="320" y1="165" x2="295" y2="138" stroke="rgba(196,181,253,0.3)" stroke-width="1"/>
  <line x1="240" y1="235" x2="265" y2="262" stroke="rgba(196,181,253,0.3)" stroke-width="1"/>
  <line x1="320" y1="235" x2="295" y2="262" stroke="rgba(196,181,253,0.3)" stroke-width="1"/>
  
  <!-- Arrow connecting brain to dashboard -->
  <line x1="360" y1="200" x2="400" y2="200" stroke="rgba(216,180,254,0.6)" stroke-width="2"/>
  <polygon points="400,194 400,206 412,200" fill="rgba(216,180,254,0.6)"/>
  
  <!-- Dashboard panel -->
  <rect x="420" y="120" width="290" height="200" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(196,181,253,0.3)" stroke-width="1"/>
  <!-- Dashboard header -->
  <rect x="420" y="120" width="290" height="36" rx="12" fill="rgba(139,92,246,0.4)"/>
  <circle cx="440" cy="138" r="6" fill="rgba(255,255,255,0.4)"/>
  <circle cx="458" cy="138" r="6" fill="rgba(255,255,255,0.25)"/>
  <circle cx="476" cy="138" r="6" fill="rgba(255,255,255,0.15)"/>
  <!-- AI Status bar -->
  <text x="500" y="143" text-anchor="middle" font-family="system-ui" font-size="11" fill="rgba(216,180,254,0.9)">AI Project Dashboard</text>
  <!-- Kanban columns -->
  <rect x="432" y="166" width="60" height="130" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="436" y="175" width="52" height="18" rx="4" fill="rgba(139,92,246,0.5)"/>
  <rect x="436" y="198" width="52" height="14" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="436" y="216" width="52" height="14" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="436" y="234" width="52" height="14" rx="3" fill="rgba(255,255,255,0.1)"/>
  
  <rect x="500" y="166" width="60" height="130" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="504" y="175" width="52" height="18" rx="4" fill="rgba(192,38,211,0.5)"/>
  <rect x="504" y="198" width="52" height="14" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="504" y="216" width="52" height="14" rx="3" fill="rgba(255,255,255,0.1)"/>
  
  <rect x="568" y="166" width="60" height="130" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="572" y="175" width="52" height="18" rx="4" fill="rgba(34,197,94,0.5)"/>
  <rect x="572" y="198" width="52" height="14" rx="3" fill="rgba(255,255,255,0.1)"/>
  
  <rect x="636" y="166" width="62" height="130" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="640" y="175" width="54" height="18" rx="4" fill="rgba(251,191,36,0.4)"/>
  
  <!-- Glow at bottom -->
  <ellipse cx="400" cy="440" rx="320" ry="30" fill="rgba(168,85,247,0.15)"/>
</svg>
