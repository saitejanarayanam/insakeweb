<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.14)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Large shield with key -->
  <path d="M400 90 L500 125 V225 C500 300 455 345 400 370 C345 345 300 300 300 225 V125 Z"
        fill="url(#card)" stroke="rgba(199,210,254,0.5)" stroke-width="2.5"/>
  <circle cx="400" cy="200" r="26" fill="none" stroke="#a5b4fc" stroke-width="6"/>
  <rect x="391" y="222" width="18" height="55" rx="4" fill="#a5b4fc"/>
  <rect x="400" y="252" width="26" height="8" rx="3" fill="#a5b4fc"/>
  <rect x="400" y="266" width="20" height="8" rx="3" fill="#a5b4fc"/>

  <!-- Org / leadership hierarchy to the right -->
  <circle cx="620" cy="120" r="22" fill="rgba(165,180,252,0.3)" stroke="#c7d2fe" stroke-width="2"/>
  <line x1="620" y1="142" x2="620" y2="170" stroke="rgba(199,210,254,0.4)" stroke-width="1.5"/>
  <line x1="560" y1="185" x2="680" y2="185" stroke="rgba(199,210,254,0.4)" stroke-width="1.5"/>
  <line x1="560" y1="185" x2="560" y2="170" stroke="rgba(199,210,254,0.4)" stroke-width="1.5"/>
  <line x1="680" y1="185" x2="680" y2="170" stroke="rgba(199,210,254,0.4)" stroke-width="1.5"/>

  <circle cx="560" cy="205" r="16" fill="rgba(99,102,241,0.35)" stroke="#c7d2fe" stroke-width="1.5"/>
  <circle cx="620" cy="205" r="16" fill="rgba(99,102,241,0.35)" stroke="#c7d2fe" stroke-width="1.5"/>
  <circle cx="680" cy="205" r="16" fill="rgba(99,102,241,0.35)" stroke="#c7d2fe" stroke-width="1.5"/>

  <!-- Risk / policy panel -->
  <rect x="540" y="240" width="180" height="130" rx="12" fill="url(#card)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="558" y="258" width="90" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>
  <rect x="558" y="280" width="144" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
  <rect x="558" y="280" width="96" height="10" rx="5" fill="#a5b4fc"/>
  <rect x="558" y="300" width="144" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
  <rect x="558" y="300" width="60" height="10" rx="5" fill="#818cf8"/>
  <rect x="558" y="320" width="144" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
  <rect x="558" y="320" width="120" height="10" rx="5" fill="#c7d2fe"/>
  <text x="648" y="270" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.6)"></text>

  <!-- Title -->
  <rect x="60" y="375" width="240" height="52" rx="10" fill="rgba(0,0,0,0.32)"/>
  <text x="180" y="397" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="white">CISM Certification</text>
  <text x="180" y="415" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.75)">Certified Information Security Manager</text>

  <ellipse cx="400" cy="440" rx="320" ry="18" fill="rgba(67,56,202,0.2)"/>
</svg>
