name: Daily blog - generate drafts

on:
  schedule:
    - cron: "30 1 * * *" # 7:00 AM IST (UTC+5:30)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Generate draft blog posts
        run: npm run blog:generate -- --count=3

      - name: Commit any newly generated cover images
        run: |
          git config user.name "insake-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/blog
          if ! git diff --cached --quiet; then
            git commit -m "chore: add AI-generated blog cover images"
            git push
          else
            echo "No new images to commit (image generation likely fell back to existing course images)."
          fi
